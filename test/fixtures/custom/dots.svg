<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#000" stroke-width="3">
  <!-- zero-length subpaths render as dots with round caps -->
  <g stroke-linecap="round">
    <path d="M4 4v0"/>
    <path d="M12 4l0 0"/>
    <path d="M20 4h0"/>
    <path d="M28 4"/>
    <path d="M36 4z"/>
    <path d="M44 4c0 0 0 0 0 0"/>
    <line x1="4" y1="12" x2="4" y2="12"/>
    <polyline points="12,12 12,12 12,12"/>
    <!-- the Tabler convention: a hairline that is practically a dot -->
    <path d="M20 12h.01"/>
    <!-- several dots in one path -->
    <path d="M28 12v0m8 0v0m8 0v0"/>
  </g>
  <!-- square caps render squares, butt caps render nothing -->
  <g stroke-linecap="square">
    <path d="M4 20v0"/>
    <path d="M12 20h.01"/>
  </g>
  <g stroke-linecap="butt">
    <path d="M20 20v0"/>
    <path d="M28 20h.01"/>
  </g>
  <!-- dots touching and overlapping each other -->
  <path stroke-linecap="round" d="M4 28v0m3 0v0m3 0v0m3 0v0"/>
  <path stroke-linecap="round" d="M20 28v0m1 0v0m1 0v0m1 0v0m1 0v0"/>
  <!-- a circle with zero radius and a rect with zero size are not rendered -->
  <circle cx="36" cy="28" r="0"/>
  <rect x="44" y="28" width="0" height="0"/>
  <!-- dotted line built from zero-length dashes -->
  <path stroke-linecap="round" d="M4 40v0m6 0v0m6 0v0m6 0v0m6 0v0m6 0v0m6 0v0m6 0v0"/>
</svg>
